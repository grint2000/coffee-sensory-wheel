name: Credential checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  credential-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Test credential detection
        run: python3 -m unittest discover -s tests -p 'test_secret_scan.py'
      - name: Reject new credential literals
        run: python3 scripts/check-secrets.py
