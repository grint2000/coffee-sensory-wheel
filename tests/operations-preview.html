<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>커핑 운영 검증</title>
<style>body{font:14px system-ui;margin:12px;background:#eef2f7}button,select{min-height:44px;margin:3px}iframe{display:block;height:850px;max-width:100%;border:1px solid #999;background:white}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<h1>커핑 운영 검증</h1>
<p>실제 화면 코드를 별도 시험 저장소에서 실행합니다. 팀 연결·PWA 등록은 제외합니다.</p>
<label>화면 너비 <select id="width"><option value="1100">1100px PC</option><option value="375">375px 모바일</option><option value="320">320px 모바일</option></select></label>
<button id="reset">시험 기록 초기화</button><button id="reload">기록 다시 열기</button>
<button id="inspect">시험 저장 상태 확인</button><button id="valid">정상 JSON 파일 시험</button><button id="invalid">잘못된 JSON 파일 시험</button>
<button id="fail">저장 실패 모의 전환</button>
<pre id="result" role="status">불러오는 중</pre><iframe id="app" title="운영 시험 화면" width="1100"></iframe>
<script>
(async()=>{
 const result=document.getElementById('result'),frame=document.getElementById('app');
 const prefix='noel_qa_operations_';
 const scoped=s=>s.replaceAll('noel_sca_',prefix).replaceAll('mollis_sca_','mollis_qa_operations_');
 const files=await Promise.all(['index.html','flavor-reference.js','data-store.js','extras.js'].map(async p=>{const r=await fetch('../'+p);if(!r.ok)throw Error(p);return r.text();}));
 const inline=s=>'<script>'+s.replaceAll('</script','<\\/script')+'<'+ '/script>';
 let html=scoped(files[0]).replace('<head>','<head><base href="'+new URL('../',location.href).href+'">');
 html=html.replace('<script src="flavor-reference.js"><'+ '/script>',()=>inline(files[1]));
 html=html.replace('<script src="data-store.js"><'+ '/script>',()=>inline(scoped(files[2])));
 html=html.replace('<script src="extras.js"><'+ '/script>',()=>inline(scoped(files[3]).replace("if ('serviceWorker' in navigator)",'if (false)')));
 html=html.replace('<script type="module" src="team.js"><'+ '/script>','').replace('<script src="theme.js"><'+ '/script>','');
 const open=()=>{frame.srcdoc=html;};
 frame.addEventListener('load',()=>{result.textContent='준비 완료 · 시험 저장소만 사용';});open();
 document.getElementById('width').onchange=e=>frame.width=e.target.value;
 document.getElementById('reset').onclick=()=>{
   const keys=Object.keys(localStorage).filter(k=>k.startsWith(prefix)||k.startsWith('mollis_qa_operations_'));
   // Disable only this fixture's old beforeunload save while discarding its test records.
   frame.contentWindow.NOEL_DATA.commit=()=>{throw Error('시험 초기화');};
   keys.forEach(k=>localStorage.removeItem(k));open();
 };
 document.getElementById('reload').onclick=()=>open();
 document.getElementById('inspect').onclick=()=>{
   const raw=localStorage.getItem(prefix+'sessions_default');
   result.textContent=raw?JSON.stringify(JSON.parse(raw),null,2):'아직 시험 기록이 저장되지 않았습니다.';
 };
 function upload(value){
   const win=frame.contentWindow,dt=new win.DataTransfer();
   dt.items.add(new win.File([JSON.stringify(value)],'qa-records.json',{type:'application/json'}));
   const input=win.document.getElementById('importSamplesInput');input.files=dt.files;input.dispatchEvent(new win.Event('change',{bubbles:true}));
 }
 document.getElementById('valid').onclick=()=>{
   const win=frame.contentWindow;
   const state=win.getLocalCuppingState();const session=state.sessions.find(s=>s.id===state.currentSessionId);
   session.title='JSON 왕복 시험';session.samples[0].title='가져온 검증 샘플';session.samples[0].sampleData.coffeeName='QC JSON 복원';
   upload(session);
 };
 document.getElementById('invalid').onclick=()=>upload({samples:[{sampleData:null}]});
 let originalCommit;
 document.getElementById('fail').onclick=()=>{
   const api=frame.contentWindow.NOEL_DATA;
   if(originalCommit){api.commit=originalCommit;originalCommit=null;result.textContent='저장 실패 모의 해제';}
   else{originalCommit=api.commit;api.commit=()=>{throw Error('QA simulated quota failure');};result.textContent='저장 실패 모의 활성화';}
 };
})().catch(e=>{document.getElementById('result').textContent='ERROR '+e.message;});
</script></html>
